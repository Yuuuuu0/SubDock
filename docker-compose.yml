services:
  subdock:
    container_name: subdock
    image: yuuuuu0/subdock:latest
    pull_policy: always
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    # 可选：在同目录 .env 中设置 JWT_SECRET，由 Compose 注入容器。
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WEBSITE_TITLE: ${WEBSITE_TITLE:-SubDock}
    restart: always
